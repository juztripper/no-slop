name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsx scripts/package-release.ts
      - uses: actions/upload-artifact@v4
        with:
          name: no-slop-chromium
          path: artifacts/releases/
          if-no-files-found: error
